<mat-form-field appearance="outline" subscriptSizing="dynamic" class="search">
  <mat-label>Search products</mat-label>
  <svg matPrefix class="icon lead" viewBox="0 0 24 24" aria-hidden="true">
    <path
      d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.3 4.3-1.4 1.4-4.3-4.3A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"
    />
  </svg>
  <input
    matInput
    type="text"
    autocomplete="off"
    autocapitalize="off"
    spellcheck="false"
    enterkeyhint="search"
    placeholder="Try “mascara”, “laptop”, “watch”…"
    [formControl]="control"
    [matAutocomplete]="auto"
  />
  @if (control.value) {
    <button
      matSuffix
      mat-icon-button
      type="button"
      class="clear"
      aria-label="Clear search"
      (click)="clear()"
    >
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4 6.4 5Z"
        />
      </svg>
    </button>
  }
  <mat-autocomplete #auto="matAutocomplete" autoActiveFirstOption>
    @for (s of suggestions(); track s.text) {
      <mat-option [value]="s.text">
        <span class="option">
          @if (s.source === 'history') {
            <svg class="icon" viewBox="0 0 24 24" aria-label="Recent search">
              <path
                d="M13 3a9 9 0 0 0-9 9H1l3.9 3.9.1.1L9 12H6a7 7 0 1 1 2.05 4.95l-1.42 1.42A9 9 0 1 0 13 3Zm-1 5v5l4.3 2.5.8-1.3-3.6-2.1V8H12Z"
              />
            </svg>
          } @else {
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.3 4.3-1.4 1.4-4.3-4.3A7.5 7.5 0 1 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"
              />
            </svg>
          }
          {{ s.text }}
        </span>
      </mat-option>
    }
  </mat-autocomplete>
</mat-form-field>
