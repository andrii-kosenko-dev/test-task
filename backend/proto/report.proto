syntax = "proto3";

package report.v1;

option go_package = "report-service/internal/gen/reportv1";

// Renders a PDF report with charts from time series data.
service ReportService {
  rpc GenerateReport(GenerateReportRequest) returns (GenerateReportResponse);
}

message Point {
  int64 timestamp_ms = 1; // bucket start, unix epoch milliseconds
  double value = 2;       // events in the bucket
}

message Series {
  string type = 1;           // event type, e.g. "products.searched"
  repeated Point points = 2; // ascending by timestamp
}

message GenerateReportRequest {
  string title = 1;
  int64 from_ms = 2;
  int64 to_ms = 3;
  int64 bucket_ms = 4;
  repeated Series series = 5;
}

message GenerateReportResponse {
  bytes pdf = 1;
  string filename = 2;
}
